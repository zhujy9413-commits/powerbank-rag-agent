<svg xmlns="http://www.w3.org/2000/svg" width="680" height="840" viewBox="0 0 680 840" role="img" aria-labelledby="title description"><title id="title">AI Work 报告评审业务流程</title><desc id="description">上传报告后核对解析，确认依据、版本与清单。任务级前提明确后逐项核对，再人工复核和导出；前提缺失返回确认，补材料或更换依据产生新修订。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#59766c"/></marker></defs><style>text{font:17px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183b32}.edge{fill:none;stroke:#59766c;stroke-width:1.7}.return{stroke-dasharray:6 5}.node rect,.node path{fill:#f3f8f5;stroke:#9bb6aa;stroke-width:1.4}.node.emphasis rect{fill:#e4f1e9;stroke:#558b70}.node.decision path{fill:#fff7e6;stroke:#bea15f}.edge-label{font-size:15px;fill:#54685e}</style><rect width="100%" height="100%" fill="#fff"/><path class="edge" d="M340 104 V142" marker-end="url(#arrow)"/><path class="edge" d="M340 206 V244" marker-end="url(#arrow)"/><path class="edge" d="M340 308 V350" marker-end="url(#arrow)"/><path class="edge" d="M340 450 V506" marker-end="url(#arrow)"/><path class="edge" d="M340 570 V616" marker-end="url(#arrow)"/><path class="edge" d="M340 680 V726" marker-end="url(#arrow)"/><path class="edge return" d="M200 400 H65 V276 H160" marker-end="url(#arrow)"/><path class="edge return" d="M520 648 H610 V174 H520" marker-end="url(#arrow)"/><g class="node "><rect x="160" y="40" width="360" height="64" rx="8"/><text x="340" y="65" text-anchor="middle" class=""><tspan x="340" dy="0">上传本次报告</tspan><tspan x="340" dy="24">保存报告身份与输入修订</tspan></text></g><g class="node "><rect x="160" y="142" width="360" height="64" rx="8"/><text x="340" y="167" text-anchor="middle" class=""><tspan x="340" dy="0">核对解析与原文</tspan><tspan x="340" dy="24">修正明确错误，保留未知区域</tspan></text></g><g class="node "><rect x="160" y="244" width="360" height="64" rx="8"/><text x="340" y="269" text-anchor="middle" class=""><tspan x="340" dy="0">确认采用依据与版本</tspan><tspan x="340" dy="24">确认检查清单和范围限制</tspan></text></g><g class="node decision"><path d="M340,350 L480,400 L340,450 L200,400 Z"/><text x="340" y="393" text-anchor="middle" class=""><tspan x="340" dy="0">任务级启动前提</tspan><tspan x="340" dy="24">是否明确？</tspan></text></g><g class="node emphasis"><rect x="160" y="506" width="360" height="64" rx="8"/><text x="340" y="531" text-anchor="middle" class=""><tspan x="340" dy="0">按检查单元找证与核对</tspan><tspan x="340" dy="24">记录结果、未检查及失败原因</tspan></text></g><g class="node "><rect x="160" y="616" width="360" height="64" rx="8"/><text x="340" y="641" text-anchor="middle" class=""><tspan x="340" dy="0">查看证据并人工复核</tspan><tspan x="340" dy="24">记录处置理由和未决项</tspan></text></g><g class="node "><rect x="160" y="726" width="360" height="64" rx="8"/><text x="340" y="751" text-anchor="middle" class=""><tspan x="340" dy="0">导出评审清单</tspan><tspan x="340" dy="24">保留范围、证据和完整状态</tspan></text></g><g><rect x="25" y="323" width="134" height="58" fill="#fff"/><text x="92" y="342" text-anchor="middle" class="edge-label"><tspan x="92" dy="0">否</tspan><tspan x="92" dy="24">补充或更正</tspan></text></g><text x="366" y="480" text-anchor="middle" class="edge-label"><tspan x="366" dy="0">是</tspan></text><g><rect x="542" y="363" width="134" height="58" fill="#fff"/><text x="609" y="382" text-anchor="middle" class="edge-label"><tspan x="609" dy="0">补材料或改依据</tspan><tspan x="609" dy="24">新修订重新确认</tspan></text></g></svg>
