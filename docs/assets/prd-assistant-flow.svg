<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1060" viewBox="0 0 720 1060" role="img" aria-labelledby="title description"><title id="title">内部智能客服 搜索与单轮问答流程</title><desc id="description">提交问题与显式范围，缺少影响适用性的条件时回填并提交完整新请求。条件明确后授权检索；搜索交付资料，回答按证据交付完整、部分或缺证状态，用户查看原文和反馈。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#59766c"/></marker></defs><style>text{font:17px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#183b32}.edge{fill:none;stroke:#59766c;stroke-width:1.7}.return{stroke-dasharray:6 5}.node rect,.node path{fill:#f3f8f5;stroke:#9bb6aa;stroke-width:1.4}.node.emphasis rect{fill:#e4f1e9;stroke:#558b70}.node.decision path{fill:#fff7e6;stroke:#bea15f}.edge-label{font-size:15px;fill:#54685e}</style><rect width="100%" height="100%" fill="#fff"/><path class="edge" d="M350 104 V144" marker-end="url(#arrow)"/><path class="edge" d="M350 208 V252" marker-end="url(#arrow)"/><path class="edge" d="M350 352 V408" marker-end="url(#arrow)"/><path class="edge" d="M350 472 V522" marker-end="url(#arrow)"/><path class="edge return" d="M210 302 H62 V72 H170" marker-end="url(#arrow)"/><path class="edge" d="M210 570 H145 V670" marker-end="url(#arrow)"/><path class="edge" d="M350 618 V640 H500 V670" marker-end="url(#arrow)"/><path class="edge" d="M500 750 V798" marker-end="url(#arrow)"/><path class="edge" d="M500 862 V922 H350 V958" marker-end="url(#arrow)"/><path class="edge" d="M145 750 V990 H170" marker-end="url(#arrow)"/><g class="node "><rect x="170" y="40" width="360" height="64" rx="8"/><text x="350" y="65" text-anchor="middle" class=""><tspan x="350" dy="0">选择搜索或回答模式</tspan><tspan x="350" dy="24">提交问题与显式范围</tspan></text></g><g class="node "><rect x="170" y="144" width="360" height="64" rx="8"/><text x="350" y="169" text-anchor="middle" class=""><tspan x="350" dy="0">核对本次意图与范围</tspan><tspan x="350" dy="24">以及必要的对象、版本和条件</tspan></text></g><g class="node decision"><path d="M350,252 L490,302 L350,352 L210,302 Z"/><text x="350" y="295" text-anchor="middle" class=""><tspan x="350" dy="0">本次任务必要范围</tspan><tspan x="350" dy="24">是否明确？</tspan></text></g><g class="node emphasis"><rect x="170" y="408" width="360" height="64" rx="8"/><text x="350" y="433" text-anchor="middle" class=""><tspan x="350" dy="0">按当前权限与版本检索</tspan><tspan x="350" dy="24">整理来源、条件和证据</tspan></text></g><g class="node decision"><path d="M350,522 L490,570 L350,618 L210,570 Z"/><text x="350" y="563" text-anchor="middle" class=""><tspan x="350" dy="0">本次选择</tspan><tspan x="350" dy="24">哪种模式？</tspan></text></g><g class="node "><rect x="20" y="670" width="250" height="80" rx="8"/><text x="145" y="703" text-anchor="middle" class=""><tspan x="145" dy="0">交付资料列表与命中位置</tspan><tspan x="145" dy="24">支持查看原文</tspan></text></g><g class="node "><rect x="350" y="670" width="300" height="80" rx="8"/><text x="500" y="703" text-anchor="middle" class=""><tspan x="500" dy="0">生成可被证据支持的内容</tspan><tspan x="500" dy="24">或说明缺少的依据</tspan></text></g><g class="node "><rect x="350" y="798" width="300" height="64" rx="8"/><text x="500" y="823" text-anchor="middle" class=""><tspan x="500" dy="0">校验引用与支持关系</tspan><tspan x="500" dy="24">交付完成、部分或缺证状态</tspan></text></g><g class="node "><rect x="170" y="958" width="360" height="64" rx="8"/><text x="350" y="983" text-anchor="middle" class=""><tspan x="350" dy="0">用户查证并提供简单反馈</tspan><tspan x="350" dy="24">新问题提交新的完整请求</tspan></text></g><g><rect x="23" y="163" width="134" height="82" fill="#fff"/><text x="90" y="170" text-anchor="middle" class="edge-label"><tspan x="90" dy="0">否：待补充</tspan><tspan x="90" dy="24">回填完整条件</tspan><tspan x="90" dy="24">提交新请求</tspan></text></g><text x="376" y="382" text-anchor="middle" class="edge-label"><tspan x="376" dy="0">是</tspan></text><text x="180" y="632" text-anchor="middle" class="edge-label"><tspan x="180" dy="0">搜索</tspan></text><text x="535" y="648" text-anchor="middle" class="edge-label"><tspan x="535" dy="0">回答</tspan></text></svg>
